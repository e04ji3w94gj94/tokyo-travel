  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    rel="stylesheet">
  <style>
    :root {
      --bg-a: #F6F3FF;
      --bg-b: #EAF8F4;
      --panel: #FFFFFF;
      --ink: #2B2A3D;
      --sub: #6E6C86;
      --gold: #B4801F;
      --gold-line: rgba(180, 128, 31, 0.35);
      --gold-grad: linear-gradient(135deg, #FFDD9B, #E7A93F);
      --cyan: #0E8F84;
      --cyan-bg: rgba(14, 143, 132, 0.10);
      --pink: #D1386E;
      --pink-bg: rgba(209, 56, 110, 0.10);
      --purple: #6F4FE8;
      --purple-bg: rgba(111, 79, 232, 0.10);
      --shadow: rgba(60, 50, 90, 0.10);
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    /* Light game-UI theme by design — stays the same regardless of system light/dark mode. */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px);
    }

    body {
      background:
        radial-gradient(ellipse 60% 40% at 15% -5%, rgba(111, 79, 232, 0.10), transparent 60%),
        radial-gradient(ellipse 55% 40% at 100% 0%, rgba(14, 143, 132, 0.09), transparent 60%),
        linear-gradient(180deg, var(--bg-a), var(--bg-b));
      background-attachment: fixed;
      color: var(--ink);
      font-family: "Zen Kaku Gothic New", sans-serif;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 30px 18px 90px;
    }

    /* ---- HERO ---- */
    header.hero {
      text-align: center;
      margin-bottom: 22px;
    }

    .flourish {
      display: inline-block;
      color: var(--gold);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.28em;
      margin-bottom: 10px;
      background: rgba(180, 128, 31, 0.10);
      border: 1px solid var(--gold-line);
      border-radius: 999px;
      padding: 4px 14px;
    }

    h1 {
      font-family: "Zen Kaku Gothic New", sans-serif;
      font-weight: 900;
      font-size: clamp(24px, 6.4vw, 33px);
      margin: 0 0 10px;
      color: var(--ink);
      letter-spacing: 0.02em;
    }

    .hero-sub {
      color: var(--sub);
      font-size: 13.5px;
      font-weight: 700;
      margin: 0;
    }

    /* ---- PANEL BASE (RPG window) ---- */
    .panel-box {
      position: relative;
      background: var(--panel);
      border: 1.5px solid var(--gold-line);
      border-radius: 18px;
      box-shadow: 0 6px 18px var(--shadow);
    }

    .panel-box::before,
    .panel-box::after {
      content: "";
      position: absolute;
      width: 7px;
      height: 7px;
      background: var(--gold);
      transform: rotate(45deg);
      opacity: 0.9;
    }

    .panel-box::before {
      top: -3.5px;
      left: -3.5px;
    }

    .panel-box::after {
      bottom: -3.5px;
      right: -3.5px;
    }

    /* ---- FLIGHT CARD ---- */
    .flight-card {
      padding: 18px 20px;
      margin-bottom: 22px;
    }

    .flight-card h3 {
      font-weight: 900;
      font-size: 13.5px;
      color: var(--cyan);
      margin: 0 0 10px;
      letter-spacing: 0.03em;
    }

    .flight-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--ink);
      padding: 6px 0;
      border-bottom: 1px dashed var(--gold-line);
    }

    .flight-row:last-child {
      border-bottom: none;
    }

    .flight-row .code {
      background: var(--gold-grad);
      color: #4A3200;
      font-weight: 800;
      font-size: 11.5px;
      padding: 3px 10px;
      border-radius: 999px;
      flex-shrink: 0;
    }

    .flight-row .sub {
      color: var(--sub);
      font-size: 12.5px;
      font-weight: 600;
    }

    /* ---- DAY NAV ---- */
    nav.days {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
      scroll-snap-type: x proximity;
      touch-action: pan-x;
      cursor: grab;
      padding: 4px 2px 16px;
      margin: 0 -2px 18px;
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      background: transparent;
      z-index: 5;
      scrollbar-width: none;
      user-select: none;
    }

    nav.days.dragging {
      cursor: grabbing;
      scroll-snap-type: none;
    }

    nav.days::-webkit-scrollbar {
      display: none;
    }

    nav.days button {
      scroll-snap-align: start;
      flex-shrink: 0;
      font-family: "Zen Kaku Gothic New", sans-serif;
      font-size: 13px;
      font-weight: 800;
      color: var(--ink);
      background: var(--panel);
      border: 1.5px solid var(--gold-line);
      border-radius: 10px;
      padding: 8px 13px;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 2px 8px var(--shadow);
      transition: all 0.15s;
    }

    nav.days button .wd {
      font-size: 11px;
      opacity: 0.75;
      margin-left: 4px;
      font-weight: 600;
    }

    nav.days button.active {
      background: var(--gold-grad);
      color: #4A3200;
      border-color: transparent;
    }

    .day-panel {
      display: none;
    }

    .day-panel.active {
      display: block;
      animation: fade 0.2s ease;
    }

    @keyframes fade {
      from {
        opacity: 0;
        transform: translateY(3px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    .day-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
    }

    .day-pill {
      font-size: 12px;
      font-weight: 800;
      color: #4A3200;
      background: var(--gold-grad);
      border-radius: 999px;
      padding: 5px 12px;
      flex-shrink: 0;
      letter-spacing: 0.03em;
    }

    .day-title {
      font-size: 18px;
      font-weight: 900;
      color: var(--ink);
    }

    .day-theme {
      color: var(--sub);
      font-size: 13.5px;
      font-weight: 700;
      margin: 6px 0 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--gold-line);
    }

    /* ---- ITEM CARDS ---- */
    .stream {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 12px 15px;
    }

    .card .icon {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      border: 1.5px solid rgba(0, 0, 0, 0.05);
    }

    .card .body {
      min-width: 0;
    }

    .card .time {
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 3px;
      letter-spacing: 0.01em;
    }

    .card .title {
      font-size: 14.5px;
      font-weight: 800;
      color: var(--ink);
      margin-bottom: 3px;
    }

    .card .desc {
      font-size: 12.5px;
      color: var(--sub);
      font-weight: 600;
    }

    .card .tag {
      display: inline-block;
      margin-top: 6px;
      font-size: 11px;
      font-weight: 800;
      color: #4A3200;
      background: var(--gold-grad);
      padding: 2px 9px;
      border-radius: 999px;
    }

    .cat-sight .icon {
      background: var(--cyan-bg);
      color: var(--cyan);
    }

    .cat-sight .time {
      color: var(--cyan);
    }

    .cat-food .icon {
      background: var(--pink-bg);
      color: var(--pink);
    }

    .cat-food .time {
      color: var(--pink);
    }

    .cat-move .icon {
      background: var(--purple-bg);
      color: var(--purple);
    }

      color: var(--purple);
    }

    .cat-stay .icon {
      background: rgba(180, 128, 31, 0.12);
      color: var(--gold);
    }

    .cat-stay .time {
      color: var(--gold);
    }
  </style>
</head>

          { time: "21:15–23:55", title: "航班 TR875　東京成田機場 (T1) → 桃園機場", desc: "", cat: "move" },
        ]
      },
    ];

    const nav = document.getElementById("dayNav");
    const panels = document.getElementById("dayPanels");

    DAYS.forEach((day, i) => {
      const btn = document.createElement("button");
      btn.innerHTML = `${day.date}<span class="wd">(${day.weekday})</span>`;
      btn.addEventListener("click", () => selectDay(i));
      nav.appendChild(btn);

      const panel = document.createElement("section");
      panel.className = "day-panel";
      panel.id = `day-${i}`;

      const head = document.createElement("div");
      head.className = "day-head";
      head.innerHTML = `<span class="day-pill">DAY ${i + 1}</span><span class="day-title">${day.date}（${day.weekday}）</span>`;
      panel.appendChild(head);

      const theme = document.createElement("div");
      theme.className = "day-theme";
      theme.textContent = day.theme;
      panel.appendChild(theme);

      const stream = document.createElement("div");
      stream.className = "stream";

      day.items.forEach(it => {
        const item = document.createElement("div");
        item.className = `panel-box card cat-${it.cat}`;
        let html = `<div class="icon">${ICON[it.cat]}</div><div class="body">`;
        if (it.time) html += `<div class="time">${it.time}</div>`;
        html += `<div class="title">${it.title}</div>`;
        if (it.desc) html += `<div class="desc">${it.desc}</div>`;
        if (it.tag) html += `<div class="tag">${it.tag}</div>`;
        html += `</div>`;
        item.innerHTML = html;
        stream.appendChild(item);
      });

      panel.appendChild(stream);
      panels.appendChild(panel);
    });

    // 讓日期選單可以用滑鼠拖曳（桌機／觸控板），觸控裝置原生支援滑動
    (function enableDragScroll(el) {
      let isDown = false, startX = 0, startScroll = 0, moved = false;
      el.addEventListener("mousedown", (e) => {
        isDown = true; moved = false;
        el.classList.add("dragging");
        startX = e.pageX;
        startScroll = el.scrollLeft;
      });
      window.addEventListener("mouseup", () => { isDown = false; el.classList.remove("dragging"); });
      window.addEventListener("mousemove", (e) => {
        if (!isDown) return;
        e.preventDefault();
        const dx = e.pageX - startX;
        if (Math.abs(dx) > 4) moved = true;
        el.scrollLeft = startScroll - dx;
      });
      // 拖曳後避免誤觸點擊切換日期
      el.addEventListener("click", (e) => { if (moved) { e.stopPropagation(); e.preventDefault(); } }, true);
    })(nav);

    function selectDay(i) {
      document.querySelectorAll("nav.days button").forEach((b, bi) => b.classList.toggle("active", bi === i));
      document.querySelectorAll(".day-panel").forEach((p, pi) => p.classList.toggle("active", pi === i));
      const activeBtn = nav.children[i];
      if (activeBtn) activeBtn.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
    }

    selectDay(0);
  </script>
</body>

</html>
