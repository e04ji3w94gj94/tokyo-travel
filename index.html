<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>東京旅遊行程 10/05–10/15</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FBF3E7;
    --card: #FFFCF6;
    --ink: #4A3728;
    --sub: #9C8770;
    --line: #EBDBC0;
    --icon-bg: #F5E7CE;
    --accent: #C4693B;
    --accent-2: #FFFCF6;
    --shadow: rgba(74, 55, 40, 0.08);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --paper: #221B14;
      --card: #2B2318;
      --ink: #F1E6D6;
      --sub: #B29C82;
      --line: #3D3122;
      --icon-bg: #3A2E1E;
      --accent: #E08A5B;
      --accent-2: #221B14;
      --shadow: rgba(0, 0, 0, 0.35);
    }
  }
  :root[data-theme="dark"] {
    --paper: #221B14;
    --card: #2B2318;
    --ink: #F1E6D6;
    --sub: #B29C82;
    --line: #3D3122;
    --icon-bg: #3A2E1E;
    --accent: #E08A5B;
    --accent-2: #221B14;
    --shadow: rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "M PLUS Rounded 1c", sans-serif;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 720px; margin: 0 auto; padding: 30px 20px 90px; }

  /* ---- HERO ---- */
  header.hero { text-align: center; margin-bottom: 22px; }
  .hero-emoji { font-size: 32px; margin-bottom: 6px; }
  h1 {
    font-weight: 800;
    font-size: clamp(22px, 6vw, 30px);
    color: var(--ink);
    margin: 0 0 8px;
  }
  .hero-sub {
    color: var(--sub);
    font-size: 14px;
    font-weight: 500;
    margin: 0;
  }

  /* ---- FLIGHT CARD ---- */
  .flight-card {
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 18px;
    padding: 18px 20px;
    margin-bottom: 22px;
    box-shadow: 0 3px 12px var(--shadow);
  }
  .flight-card h3 {
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    margin: 0 0 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .flight-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    font-size: 13.5px;
    font-weight: 500;
    padding: 6px 0;
  }
  .flight-row .code {
    background: var(--accent);
    color: var(--accent-2);
    font-weight: 700;
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 999px;
    flex-shrink: 0;
  }
  .flight-row .sub { color: var(--sub); font-size: 12.5px; }

  /* ---- DAY NAV ---- */
  nav.days {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 4px 2px 16px;
    margin: 0 -2px 18px;
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    background: var(--paper);
    z-index: 5;
    scrollbar-width: none;
  }
  nav.days::-webkit-scrollbar { display: none; }
  nav.days button {
    flex-shrink: 0;
    font-family: "M PLUS Rounded 1c", sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--ink);
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 999px;
    padding: 8px 14px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  nav.days button .wd { font-size: 11px; opacity: 0.7; margin-left: 4px; font-weight: 500; }
  nav.days button.active {
    background: var(--accent);
    color: var(--accent-2);
    border-color: var(--accent);
  }

  .day-panel { display: none; }
  .day-panel.active { display: block; animation: fade 0.2s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }

  .day-head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .day-pill {
    font-size: 12px;
    font-weight: 700;
    color: var(--accent-2);
    background: var(--accent);
    border-radius: 999px;
    padding: 4px 12px;
    flex-shrink: 0;
  }
  .day-title { font-size: 19px; font-weight: 800; color: var(--ink); }
  .day-theme {
    color: var(--sub);
    font-size: 13.5px;
    font-weight: 500;
    margin: 4px 0 18px;
    padding-bottom: 12px;
    border-bottom: 1.5px dashed var(--line);
  }

  /* ---- ITEM CARDS ---- */
  .stream { display: flex; flex-direction: column; gap: 10px; }
  .card {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 16px;
    padding: 12px 15px;
    box-shadow: 0 2px 8px var(--shadow);
  }
  .card .icon {
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    background: var(--icon-bg);
    border: 1.5px solid var(--line);
  }
  .card .body { min-width: 0; }
  .card .time {
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 2px;
  }
  .card .title { font-size: 14.5px; font-weight: 700; color: var(--ink); margin-bottom: 2px; }
  .card .desc { font-size: 12.5px; color: var(--sub); font-weight: 500; }
  .card .tag {
    display: inline-block;
    margin-top: 6px;
    font-size: 11px;
    font-weight: 700;
    background: var(--icon-bg);
    color: var(--accent);
    border: 1.5px solid var(--line);
    padding: 2px 9px;
    border-radius: 999px;
  }
</style>
</head>

const nav = document.getElementById("dayNav");
const panels = document.getElementById("dayPanels");

DAYS.forEach((day, i) => {
  const btn = document.createElement("button");
  btn.innerHTML = `${day.date}<span class="wd">(${day.weekday})</span>`;
  btn.addEventListener("click", () => selectDay(i));
  nav.appendChild(btn);

  const panel = document.createElement("section");
  panel.className = "day-panel";
  panel.id = `day-${i}`;

  const head = document.createElement("div");
  head.className = "day-head";
  head.innerHTML = `<span class="day-pill">DAY ${i + 1}</span><span class="day-title">${day.date}（${day.weekday}）</span>`;
  panel.appendChild(head);

  const theme = document.createElement("div");
  theme.className = "day-theme";
  theme.textContent = day.theme;
  panel.appendChild(theme);

  const stream = document.createElement("div");
  stream.className = "stream";

  day.items.forEach(it => {
    const item = document.createElement("div");
    item.className = "card";
    let html = `<div class="icon">${ICON[it.cat]}</div><div class="body">`;
    if (it.time) html += `<div class="time">${it.time}</div>`;
    html += `<div class="title">${it.title}</div>`;
    if (it.desc) html += `<div class="desc">${it.desc}</div>`;
    if (it.tag) html += `<div class="tag">${it.tag}</div>`;
    html += `</div>`;
    item.innerHTML = html;
    stream.appendChild(item);
  });

  panel.appendChild(stream);
  panels.appendChild(panel);
});

function selectDay(i) {
  document.querySelectorAll("nav.days button").forEach((b, bi) => b.classList.toggle("active", bi === i));
  document.querySelectorAll(".day-panel").forEach((p, pi) => p.classList.toggle("active", pi === i));
  const activeBtn = nav.children[i];
  if (activeBtn) activeBtn.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
}

selectDay(0);

</html>
